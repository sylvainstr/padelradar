name: PadelRadar

on:
  schedule:
    # Toutes les 30 min de 6h à 23h (heure de Paris, cron en UTC)
    - cron: "7,37 5-21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: padelradar

jobs:
  radar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - run: python padelradar.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Sauvegarde des tournois déjà vus
        run: |
          git config user.name "padelradar"
          git config user.email "padelradar@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "chore: update seen tournaments" && git push)
